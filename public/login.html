<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Node Browser sign in</title><body><main><h1>Node Browser</h1><p>Sign in to your private browser session.</p><form id="f"><label>Access password <input id="p" type="password" required></label><button>Continue</button></form><p id="e" role="alert"></p></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#p').value})});let d=await r.json();if(r.ok)location.href='/';else document.querySelector('#e').textContent=d.error||'Sign in failed'};</script></body></html>
