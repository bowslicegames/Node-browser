<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>Node Browser · Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#192b4c,transparent 55%),#090d18;color:#f3f6ff;font:16px system-ui,-apple-system,sans-serif}main{width:min(100%,410px);padding:34px;border:1px solid #ffffff20;border-radius:24px;background:#111a2bea;box-shadow:0 24px 90px #0008}h1{margin:0 0 8px;font-size:30px;letter-spacing:-1px}p{color:#9ba9c0;line-height:1.5}label{display:block;margin:26px 0 8px;color:#cbd3e5;font-size:14px}input,button{width:100%;min-height:50px;border-radius:12px;font:inherit}input{padding:0 14px;border:1px solid #34435b;background:#0a1120;color:white;outline:none}input:focus{border-color:#8aa0ff}button{margin-top:14px;border:0;background:#8aa0ff;color:#081020;font-weight:700;cursor:pointer}#error{min-height:24px;color:#ff9caa;font-size:14px}
</style>
</head>
<body>
<main><h1>Node Browser</h1><p>Sign in to your private browser session.</p>
<form id="login-form"><label for="password">Access password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Continue</button><p id="error" role="alert"></p></form>
</main>
<script>
const form=document.getElementById("login-form");
const password=document.getElementById("password");
const button=document.getElementById("submit");
const error=document.getElementById("error");
form.addEventListener("submit",async event=>{
  event.preventDefault();
  button.disabled=true;
  error.textContent="";
  try{
    const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});
    const result=await response.json();
    if(!response.ok) throw new Error(result.error||"Sign in failed");
    location.replace("/");
  }catch(err){error.textContent=err.message;}
  finally{button.disabled=false;}
});
</script>
</body>
</html>
