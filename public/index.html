<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>Node Browser</title><link rel="stylesheet" href="/style.css"><script src="/baremux/index.js"></script><script src="/uv/uv.bundle.js"></script><script src="/uv/uv.config.js"></script></head><body><div class="shell"><header><div class="brand"><b>N</b>Node Browser</div><nav class="tabs" id="tabs"></nav><button class="tab" id="newtab" title="New tab">+</button></header><form class="tools" id="nav"><button type="button" id="back" title="Back">←</button><button type="button" id="forward" title="Forward">→</button><button type="button" id="reload" title="Reload">↻</button><input id="address" placeholder="Search or enter an address" autocomplete="url"><button class="go">Go</button><button type="button" id="logout">Sign out</button></form><main class="stage"><div class="welcome" id="welcome"><section><h1>A better way to browse.</h1><p>Enter a website address or search the web.</p><div class="quick"><button type="button" data-url="https://example.com">Example</button><button type="button" data-url="https://www.wikipedia.org">Wikipedia</button></div></section></div><iframe id="view" title="Browser content" referrerpolicy="no-referrer"></iframe></main><footer class="status"><span id="state">Ready</span><span>Private session · Node Browser</span></footer></div><script src="/register-sw.js"></script><script src="/browser.js"></script></body></html>
